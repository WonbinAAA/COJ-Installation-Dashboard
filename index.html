<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d60">
  <meta name="description" content="ติดตามแผนและสถานะการติดตั้งคอมพิวเตอร์ของหน่วยงานศาลยุติธรรม">
  <title>COJ Installation Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#17344c;background:#f3f7fa}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(12px,3vw,32px);background:#fff;border-bottom:1px solid #dce6ee}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:48px;height:48px;flex:none}.brand h1{font-size:clamp(16px,2vw,22px);line-height:1.2;margin:0}.brand p{font-size:12px;color:#60758a;margin:3px 0 0}
    .open-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border-radius:9px;background:#0e7186;color:#fff;text-decoration:none;font-size:14px;font-weight:700;padding:8px 14px;white-space:nowrap}
    .open-link:focus-visible{outline:3px solid #79c5d2;outline-offset:3px}.frame-shell{min-height:0;padding:12px clamp(8px,2vw,24px) 16px}
    iframe{display:block;width:100%;height:100%;border:1px solid #dce6ee;border-radius:16px;background:#fff;box-shadow:0 8px 28px #17344c14}
    @media(max-width:600px){.topbar{padding:9px 10px}.brand{gap:8px}.brand img{width:40px;height:40px}.brand p{display:none}.open-link{font-size:12px;padding:7px 9px;min-height:38px}.frame-shell{padding:6px 0 0}iframe{border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="./icon.svg" width="48" height="48" alt="ไอคอนการติดตั้งคอมพิวเตอร์"><div><h1>COJ Installation Dashboard</h1><p>ติดตามแผนและสถานะการติดตั้ง</p></div></div>
    <a class="open-link" href="https://script.google.com/macros/s/AKfycby16rsDsTEay1piZz7s5txF0CbuGfd53kQQc1VskHQNXHAQBau-5SdFwsQoc-ougXzGTQ/exec" target="_blank" rel="noopener noreferrer">เปิดหน้าเต็ม ↗</a>
  </header>
  <main class="frame-shell">
    <iframe title="แดชบอร์ดแผนติดตั้งคอมพิวเตอร์" src="https://script.google.com/macros/s/AKfycby16rsDsTEay1piZz7s5txF0CbuGfd53kQQc1VskHQNXHAQBau-5SdFwsQoc-ougXzGTQ/exec?embed=1" loading="eager" allow="clipboard-write"></iframe>
  </main>
</body>
</html>
